[project]
name = "faceid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django-qrcode>=0.3",
    "numpy>=2.5.2",
    "opencv-python<5",
    "pillow>=12.3.0",
    "qrcode>=8.2",
]

[project.scripts]
faceid = "faceid:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
